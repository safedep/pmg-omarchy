name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Run model tests
        run: node --test

  lint:
    name: QML lint & manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install qmllint (Qt 6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      - name: qmllint
        run: |
          QMLLINT="$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)"
          "$QMLLINT" --version
          # The Omarchy shell modules (qs.Ui, qs.Commons) and Quickshell are not
          # present in CI; qmllint tolerates the unresolved imports and still
          # catches syntax and structural errors in our QML.
          "$QMLLINT" ./*.qml

      - name: Validate manifest & structure
        run: bash scripts/validate.sh
