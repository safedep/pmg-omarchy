name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Run model tests
        run: node --test

  validate:
    name: Manifest & structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # qmllint is not run here. It needs the Omarchy shell modules (qs.Ui,
      # qs.Commons) and Quickshell, which exist only on an Omarchy machine.
      # qmllint runs locally and in the pre-commit hook instead.
      - name: Validate manifest & structure
        run: bash scripts/validate.sh
